name: AegisAI CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_password
          POSTGRES_DB: aegis_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 aegis_backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Run tests
      env:
        DATABASE_URL: postgresql://aegis:aegis_password@localhost:5432/aegis_ai
        REDIS_URL: redis://localhost:6379/0
        AEGIS_TEST_MODE: "true"
      run: |
        pytest tests/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "20"
    - name: Install dependencies
      working-directory: ./aegis_frontend
      run: npm install
    - name: Build
      working-directory: ./aegis_frontend
      run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
    - uses: actions/checkout@v3
    - name: Build the Docker images
      run: docker-compose build
