name: AegisAI CI

on:
  push:
    branches: [ "main", "v1.0" ]
  pull_request:
    branches: [ "main", "v1.0" ]

jobs:
  backend-test:
    name: Backend Regression Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    - name: Run Pytest Test Suite
      env:
        AEGIS_TEST_MODE: "true"
      run: |
        PYTHONPATH=. pytest tests/test_unit.py -q --disable-warnings

  frontend-build:
    name: Frontend Next.js Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: 'aegis_frontend/package-lock.json'
    - name: Install dependencies
      working-directory: ./aegis_frontend
      run: npm ci
    - name: Build Next.js Static Export
      working-directory: ./aegis_frontend
      run: npm run build
