name: macOS DMG Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-13
            arch: x64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest pytest-asyncio

      - name: Run Backend Unit Tests
        run: |
          PYTHONPATH=. pytest tests/test_unit.py -q --disable-warnings

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'aegis_frontend/package-lock.json'

      - name: Build Next.js Static Export
        working-directory: ./aegis_frontend
        run: |
          npm ci
          npm run build

      - name: Synchronize Frontend Export to Electron Desktop
        run: |
          rm -rf aegis_desktop/out
          cp -R aegis_frontend/out aegis_desktop/out

      - name: Compile Standalone Backend Binary with PyInstaller
        run: |
          pyinstaller aegis_backend.spec --clean --noconfirm

      - name: Package macOS DMG Application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd aegis_desktop
          npm ci
          npx electron-builder --mac dmg --${{ matrix.arch }} -c.mac.identity=null
          cd ..

      - name: Generate Checksums
        run: |
          cd dist_desktop
          for dmg in *.dmg; do
            if [ -f "$dmg" ]; then
              shasum -a 256 "$dmg" > "${dmg}.sha256"
            fi
          done
          ls -la

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisAI-macOS-${{ matrix.arch }}
          path: |
            dist_desktop/*.dmg
            dist_desktop/*.sha256

  publish-release:
    name: Publish Official GitHub Release
    needs: [build-dmg]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidate Release Assets
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -name "*.dmg*" -exec cp {} release-dist/ \;
          echo "=== Release Assets Ready for Publishing ==="
          ls -lh release-dist/

      - name: Determine Release Tag
        id: release_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_VER="${{ github.event.inputs.version }}"
            if [[ "$INPUT_VER" != v* ]]; then
              TAG="v${INPUT_VER}"
            else
              TAG="${INPUT_VER}"
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: AegisAI v${{ steps.release_version.outputs.version }} - Enterprise Offline Legal Assistant
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body: |
            ## ⚖️ AegisAI Release ${{ steps.release_version.outputs.version }}
            
            A production-ready, self-hosted, 100% offline Retrieval-Augmented Generation (RAG) assistant designed for law chambers, legal firms, and corporate legal departments.
            
            ### ✨ Highlights & Capabilities
            - **⚡ LM Studio Native Integration**: Apple Silicon MLX GPU acceleration with token streaming and OpenAI-compatible API (`http://127.0.0.1:1234`).
            - **🛡️ Air-Gapped Confidentiality**: 100% offline operation with AES-256 encrypted storage, local ChromaDB vector store, and emergency panic-button wiping.
            - **⚖️ eCourts CNR Sync & Lock**: Automatic case status synchronization and local tamper-proof locking.
            - **🔒 Security & 2FA**: Multi-user RBAC (`Admin`, `Lawyer`, `Auditor`), TOTP two-factor authentication, and tamper-evident audit logs.
            - **💼 Matter Management & GST Invoicing**: Case tracking, billable hours logging, and GST-compliant invoice generation.
            - **🖥️ Standalone Desktop App**: Bundled standalone FastAPI executable and Next.js frontend packed in native macOS DMG installer.
            
            ### 📦 Download Packages
            - **Apple Silicon (M1/M2/M3/M4 - arm64)**: `AegisAI-${{ steps.release_version.outputs.version }}-arm64.dmg`
            - **Intel Macs (x86_64 - x64)**: `AegisAI-${{ steps.release_version.outputs.version }}-x64.dmg`
            - **Integrity Checksums**: Corresponding `.dmg.sha256` files
          files: |
            release-dist/*.dmg
            release-dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
