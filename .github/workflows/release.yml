name: Release AegisAI Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-13
            arch: x64

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest pytest-asyncio

      - name: Run Backend Regression Tests
        run: |
          PYTHONPATH=. pytest tests/test_unit.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'aegis_frontend/package-lock.json'

      - name: Build Next.js Static Export
        working-directory: ./aegis_frontend
        run: |
          npm ci
          npm run build

      - name: Sync Static Assets to Desktop Wrapper
        run: |
          rm -rf aegis_desktop/out
          cp -R aegis_frontend/out aegis_desktop/out

      - name: Compile Backend Binary with PyInstaller
        run: |
          pyinstaller aegis_backend.spec --clean --noconfirm

      - name: Package Desktop App and DMG (${{ matrix.arch }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd aegis_desktop
          npm ci
          npx electron-builder --mac dmg --${{ matrix.arch }} -c.mac.identity=null
          cd ..

      - name: Generate Checksums
        run: |
          cd dist_desktop
          for file in *.dmg; do
            if [ -f "$file" ]; then
              shasum -a 256 "$file" > "${file}.sha256"
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AegisAI-macOS-${{ matrix.arch }}
          path: |
            dist_desktop/*.dmg
            dist_desktop/*.sha256

  publish-release:
    name: Publish GitHub Release 1.0.0
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -name "*.dmg*" -exec cp {} release-dist/ \;
          echo "=== Release Assets Prepared ==="
          ls -lh release-dist/

      - name: Resolve Release Tag
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: AegisAI ${{ steps.release_meta.outputs.tag }} - Enterprise Offline Legal Assistant
          draft: false
          prerelease: false
          body: |
            ## ⚖️ AegisAI Release 1.0.0
            
            A production-ready, self-hosted, 100% offline Retrieval-Augmented Generation (RAG) assistant tailored for legal chambers, law firms, and corporate legal departments.
            
            ### ✨ Highlights in Release 1.0.0
            - **⚡ LM Studio Native Integration**: Apple Silicon MLX GPU acceleration with token streaming and OpenAI-compatible API (`http://127.0.0.1:1234`).
            - **🛡️ Air-Gapped Confidentiality**: 100% offline operation with AES-256 encrypted storage, local ChromaDB vector store, and emergency panic-button wiping.
            - **⚖️ eCourts CNR Sync & Lock**: Automatic case status synchronization and local tamper-proof locking.
            - **🔒 Security & 2FA**: Multi-user RBAC (`Admin`, `Lawyer`, `Auditor`), TOTP two-factor authentication, and tamper-evident audit logs.
            - **💼 Matter Management & GST Invoicing**: Case tracking, billable hours logging, and GST-compliant invoice generation.
            - **🖥️ Standalone Desktop App**: Bundled standalone FastAPI executable and Next.js frontend packed in native macOS DMG installer.
            
            ### 📦 Download Packages
            - **Apple Silicon (M1/M2/M3/M4)**: `AegisAI-1.0.0-arm64.dmg`
            - **Intel Macs (x86_64)**: `AegisAI-1.0.0-x64.dmg`
          files: |
            release-dist/*.dmg
            release-dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
